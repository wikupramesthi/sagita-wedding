<VirtualHost *:80>
    ServerName app.example.com
    DocumentRoot /var/www/sagita-wedding/be/public

    <Directory /var/www/sagita-wedding/be/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/sagita-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/sagita-backend-access.log combined
</VirtualHost>
